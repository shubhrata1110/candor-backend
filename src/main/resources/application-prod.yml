# Production: no defaults, so a missing variable fails startup instead of connecting somewhere wrong.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

server:
  # Trust X-Forwarded-* headers from the load balancer / reverse proxy.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

app:
  frontend-url: ${FRONTEND_URL:}
  cookie-secure: true

logging:
  level:
    root: INFO
