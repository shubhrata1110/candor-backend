# Settings shared by every profile. Profile files (application-<profile>.yml) override these.
# No default profile on purpose: run with dev locally, SPRING_PROFILES_ACTIVE=prod in production.
spring:
  application:
    name: candor-backend
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
